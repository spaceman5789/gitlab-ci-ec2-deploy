version: "3.9"

services:
  api:
    build:
      context: .
      target: final        # use the production stage
    image: flask-api:latest
    container_name: flask-api-container
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
